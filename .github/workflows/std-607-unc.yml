name: verify native UNC replacement capability
on:
  push:
    branches: [fix/607-unc]
permissions:
  contents: read
jobs:
  unc:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seed-mach
      - name: Establish a private loopback share
        id: share
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force std-607-evidence | Out-Null
          try {
            Start-Service LanmanServer -ErrorAction Stop
            $owner = [Security.Principal.WindowsIdentity]::GetCurrent().Name
            New-SmbShare -Name MachStd607 -Path $env:GITHUB_WORKSPACE -FullAccess $owner -ErrorAction Stop | Out-String | Tee-Object std-607-evidence/unc-capability.log
            Add-Content $env:GITHUB_OUTPUT 'available=true'
          } catch {
            $_ | Out-String | Tee-Object std-607-evidence/unc-capability.log
            Add-Content $env:GITHUB_OUTPUT 'available=false'
          }
      - name: Probe native UNC replacements
        if: steps.share.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/std-607-census.py before-seed-info windows
          mach info | tee std-607-evidence/seed-info.log
          python .github/scripts/std-607-unc.py
      - name: Remove the owned loopback share
        if: always() && steps.share.outputs.available == 'true'
        shell: pwsh
        run: Remove-SmbShare -Name MachStd607 -Force -Confirm:$false
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: std-607-unc
          path: std-607-evidence/
