name: audit std605 listing ownership mutations
on:
  push:
    branches: [fix/605-mutations]
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x86_64
            compiler: .mach-seed/mach
          - runner: windows-latest
            target: windows-x86_64
            compiler: .mach-seed/mach.exe
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seed-mach
      - name: Verify exact listing ownership at every allocation
        shell: bash
        run: python .github/scripts/audit-605.py "$PWD/${{ matrix.compiler }}" "${{ matrix.target }}"
      - name: Retain allocation mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: std605-ownership-${{ matrix.target }}
          path: mutation-evidence/
