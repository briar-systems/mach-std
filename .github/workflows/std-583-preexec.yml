name: identify native Darwin group ownership race
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            host: darwin
            arch: x86_64
          - runner: macos-latest
            host: darwin
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/seed-mach
      - name: Compare native process group ownership orders
        shell: bash
        run: |
          mkdir -p std-583-evidence
          uname -a > std-583-evidence/native-host.txt
          sw_vers >> std-583-evidence/native-host.txt
          python3 .github/scripts/std-583-census.py native-group-build darwin
          clang -O0 -Wall -Wextra .github/scripts/std-583-groups.c -o std-583-evidence/group-probe
          python3 .github/scripts/std-583-census.py native-group-test darwin
          std-583-evidence/group-probe > std-583-evidence/native-group-orders.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: std-583-barriers-${{ matrix.host }}-${{ matrix.arch }}
          path: std-583-evidence/
