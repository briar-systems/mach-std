name: isolate released Claim state and emitted code
on:
  push:
    branches: [fix/583-verify]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qemu-mode:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install independent native and guest compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu qemu-user ninja-build libglib2.0-dev libpixman-1-dev python3-venv
      - name: Compare actual nofollow mode syscalls
        run: python3 .github/scripts/std-qemu-mode.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qemu-mode
          path: std-qemu-evidence/
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            host: windows
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/seed-mach
      - name: Build exact audited compiler serially
        shell: bash
        run: python3 .github/scripts/std-583-backup-bootstrap.py ${{ matrix.host }} ${{ matrix.arch }}
      - name: Capture failing state and code
        shell: bash
        run: python3 .github/scripts/std-583-seed-state.py ${{ matrix.host }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: seed-state-${{ matrix.host }}-${{ matrix.arch }}
          path: std-583-evidence/
