name: inspect native force deletion capabilities
on:
  push:
    branches: [fix/613-verify]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Probe local and SMB readonly disposition
        shell: pwsh
        run: .github/scripts/readonly-613-probe.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: readonly-613-native
          path: readonly-evidence
