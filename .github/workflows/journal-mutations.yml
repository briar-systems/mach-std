name: audit std581 journal mutations
on:
  push:
    branches: [fix/581-mutations]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x86_64
            compiler: .mach-seed/mach.exe
          - runner: ubuntu-latest
            target: linux-x86_64
            compiler: .mach-seed/mach
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seed-mach
      - name: Verify baseline and individual mutations
        shell: bash
        run: python .github/scripts/journal-mutations.py "$PWD/${{ matrix.compiler }}" "${{ matrix.target }}"
      - name: Retain journal evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: std581-${{ matrix.target }}-mutations
          path: journal-evidence/
