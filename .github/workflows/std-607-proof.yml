name: verify held destination replacement
on:
  push:
    branches: [fix/607-verify]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            host: linux
          - runner: windows-latest
            host: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seed-mach
      - name: Record seed
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/std-607-census.py before-seed-info ${{ matrix.host }}
          mach info | tee std-607-evidence/seed-info.log
      - name: Verify the exact expected baseline
        shell: bash
        run: python .github/scripts/std-607-proof.py ${{ matrix.host }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: std-607-${{ matrix.host }}
          path: std-607-evidence/
