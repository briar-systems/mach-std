name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  native-matrix:
    uses: ./.github/workflows/ci.yml

  release:
    needs: native-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Seed mach
        uses: ./.github/actions/seed-mach

      - name: Report the seed
        run: mach info

      - name: Build
        run: mach build .

      - name: Verify release artifact excludes test-only modules
        run: bash test/fault/verify-release.sh out/linux-x86_64/debug/lib/std

      - name: Create release
        uses: softprops/action-gh-release@v3
