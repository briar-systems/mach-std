name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify release tag matches the project version
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('mach.toml').read_text())['project']['version']
          expected = f'v{version}'
          actual = os.environ['GITHUB_REF_NAME']
          if actual != expected:
              raise SystemExit(f'release tag {actual!r} does not match project version {expected!r}')
          print(f'verified release tag {actual}')
          PY

  native-matrix:
    needs: verify-version
    uses: ./.github/workflows/ci.yml

  release:
    needs: native-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up audited mach
        uses: ./.github/actions/setup-mach

      - name: Report the compiler
        run: mach info

      - name: Build
        run: |
          python3 test/lib/compiler-census.py test/native/results release build .
          mach build .

      - name: Verify release artifact excludes test-only modules
        run: bash test/fault/verify-release.sh out/linux-x86_64/debug/lib/std

      - name: Create release
        uses: softprops/action-gh-release@v3
