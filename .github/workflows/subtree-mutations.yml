name: audit std575 subtree mutations
on:
  push:
    branches: [fix/575-mutations]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seed-mach
      - name: Verify subtree baseline and individual mutations
        run: python .github/scripts/subtree-mutations.py "$PWD/.mach-seed/mach" linux-x86_64
      - name: Retain subtree evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: std575-linux-mutations
          path: subtree-evidence/
