name: audit std603 mutations

on:
  push:
    branches: [fix/603-mutations]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seed-mach
      - name: Run baseline and independent mutations
        shell: pwsh
        run: python .github/scripts/audit-mutations.py "$PWD/.mach-seed/mach.exe"
      - name: Retain mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: std603-windows-mutations
          path: mutation-evidence/
