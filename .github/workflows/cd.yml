name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MACH_VERSION: 6.8.0

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("mach.toml", "rb"))["project"]["version"])')
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG does not match mach.toml version $version"; exit 1; }

  # the hosts this project ships to, tested natively before anything is published
  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      profile: release
      runners: '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "macos-15", "macos-15-intel"]'

  # one archive per artifact and target, except the test-only `tests` artifact, cross-compiled at the paths mach's build plan reports
  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: install mach
        run: |
          export MACH_INSTALL_DIR="$RUNNER_TEMP/mach"
          curl -fsSL "https://raw.githubusercontent.com/briar-systems/mach/v$MACH_VERSION/dist/install.sh" | sh
          echo "$MACH_INSTALL_DIR" >> "$GITHUB_PATH"
      - run: mach dep pull .
      - run: mach build . --all -p release
      - name: package
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir dist
          mach build . --all -p release --plan | awk '
            /^unit / { name = $3; for (i = 4; i < NF; i++) if ($i == "target") target = $(i + 1) }
            $1 == "tuple" { split($2, t, "-"); os = t[2] }
            $1 == "out" && name != "tests" { print name, target, os, $2 }' |
          while read -r name target os path; do
            archive="$PWD/dist/$name-$version-$target"
            case "$os" in
              windows) (cd "$(dirname "$path")" && zip -q "$archive.zip" "$(basename "$path")") ;;
              *)       tar -czf "$archive.tar.gz" -C "$(dirname "$path")" "$(basename "$path")" ;;
            esac
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [verify, ci, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: build the release body
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # the release body: the changelog section for this version, then the issues the release resolved
          # the pull requests are the merge commits in <previous tag>..<tag>. an issue counts when it is closed
          # and one of them links it, names it on a closing line, or closed it, or when its closing comment names
          # one, and it was closed no earlier than that pull request opened
          set -euo pipefail
          shopt -s inherit_errexit
          die() { echo "::error::release body: $*" >&2; exit 1; }

          tag=$TAG
          ver=${tag#v}
          git rev-parse -q --verify "refs/tags/$tag" > /dev/null || die "no tag $tag"
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$tag^") || die "no release tag before $tag"
          repo=${GITHUB_REPOSITORY:-$(gh repo view --json nameWithOwner --jq .nameWithOwner)}
          owner=${repo%/*}
          name=${repo#*/}

          # the trailing sentinel keeps the section's closing blank line
          section=$(git show "$tag:CHANGELOG.md" | awk -v h="## [$ver]" '
            index($0, "## [") == 1 { on = !done && index($0, h) == 1; done = done || on; next }
            on { print }'; echo .)
          section=${section%.}
          [ -n "${section//[[:space:]]/}" ] || die "CHANGELOG.md at $tag has no $ver section"

          numbers=$(git log --format=%s "$prev..$tag" | sed -n 's/^Merge pull request #\([0-9][0-9]*\) .*/\1/p' | sort -un)
          [ -n "$numbers" ] || die "no pull requests merged in $prev..$tag"

          # each merged pull request: when it opened and the issues it names as closed
          prs=$(for n in $numbers; do
            gh pr view "$n" -R "$repo" --json number,createdAt,closingIssuesReferences,body --jq '{
              number,
              created: (.createdAt | fromdateiso8601),
              refs: ([.closingIssuesReferences[]
                      | select(.repository.owner.login + "/" + .repository.name == "'"$repo"'") | .number]
                     + [.body // "" | scan("(?i)\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\\s+#([0-9]+)")
                        | .[0] | tonumber])}'
          done | jq -sc .)
          opened=$(jq -r 'map(.created) | min | todateiso8601' <<< "$prs")

          # every issue touched since the earliest of them opened, closed, with what closed it
          nodes=$(mktemp)
          trap 'rm -f "$nodes"' EXIT
          cursor=null
          while :; do
            page=$(gh api graphql -F owner="$owner" -F name="$name" -F since="$opened" -F cursor="$cursor" -f query='
              query($owner: String!, $name: String!, $since: DateTime!, $cursor: String) {
                repository(owner: $owner, name: $name) {
                  issues(states: CLOSED, filterBy: {since: $since}, first: 100, after: $cursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      number title url closedAt
                      comments(last: 5) { nodes { author { login } createdAt body } }
                      timelineItems(itemTypes: [CLOSED_EVENT], last: 1) {
                        nodes { ... on ClosedEvent { createdAt actor { login }
                          closer { __typename ... on PullRequest { number } ... on Commit { oid } } } }
                      }
                    }
                  }
                }
              }')
            jq -c '.data.repository.issues.nodes[]' <<< "$page" >> "$nodes"
            [ "$(jq -r .data.repository.issues.pageInfo.hasNextPage <<< "$page")" = true ] || break
            cursor=$(jq -r .data.repository.issues.pageInfo.endCursor <<< "$page")
          done
          closed=$(jq -sc . "$nodes")

          commits=$(git rev-list "$prev..$tag" | jq -Rsc 'split("\n") | map(select(. != ""))')

          # an issue with a pull request or commit as its closer counts when that one is in the range.
          # an issue closed by hand counts when a pull request in the range names it or the closing comment does
          select='
          def ev: .timelineItems.nodes[0] // {};
          def closing_comment:
            ev as $e
            | [.comments.nodes[] | select(.author.login == $e.actor.login and .createdAt <= $e.createdAt)]
            | last // {body: ""};
          def by_hand($n):
            [closing_comment.body | scan("(?:^|[^/\\w])#([0-9]+)") | .[0] | tonumber] as $named
            | [$prs[] | select(.number as $p | (.refs | index($n)) != null or ($named | index($p)) != null)];
          map((.closedAt | fromdateiso8601) as $at | .number as $n | ev.closer as $c
              | select(
                  if $c == null then by_hand($n) | any(.created <= $at)
                  elif $c.__typename == "PullRequest" then [$prs[] | select(.number == $c.number)] | any(.created <= $at)
                  elif $c.__typename == "Commit" then ($commits | index($c.oid)) != null
                  else false end))
          | sort_by(.number)
          | .[] | "- [#\(.number)](\(.url)) \(.title)"'
          list=$(jq -r --argjson prs "$prs" --argjson commits "$commits" "$select" <<< "$closed")
          count=$(grep -c . <<< "$list" || true)

          exec > "$RUNNER_TEMP/notes.md"
          printf '%s\n## Issues resolved (%d)\n\n' "$section" "$count"
          [ "$count" -eq 0 ] || printf '%s\n' "$list"
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # a doubled tag push waits on the concurrency group, then finds the release
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          flags=(--verify-tag --title "$TAG" --draft --notes-file "$RUNNER_TEMP/notes.md")
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* "${flags[@]}"
          gh release edit "$TAG" --draft=false
