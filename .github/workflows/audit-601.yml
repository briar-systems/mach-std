name: audit std601 ownership mutations
on:
  push:
    branches: [fix/601-mutations]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seed-mach
      - name: Verify exact component allocation ownership
        shell: pwsh
        run: python .github/scripts/audit-601.py "$PWD/.mach-seed/mach.exe"
      - name: Retain ownership mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: std601-windows-ownership-mutations
          path: mutation-evidence/
