name: verify transaction identity foundations
on:
  push:
    branches: [fix/583-verify]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            host: linux
            arch: x86_64
          - runner: windows-latest
            host: windows
            arch: x86_64
          - runner: macos-latest
            host: darwin
            arch: aarch64
          - runner: macos-15-intel
            host: darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/seed-mach
      - name: Retain released Darwin image and build audited compiler
        if: runner.os == 'macOS'
        run: python3 .github/scripts/std-583-darwin.py ${{ matrix.arch }}
      - name: Verify exact identity behavior
        shell: bash
        run: python3 .github/scripts/std-583-proof.py ${{ matrix.host }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: std-583-${{ matrix.host }}-${{ matrix.arch }}
          path: std-583-evidence/
