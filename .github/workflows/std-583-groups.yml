name: verify child-owned Darwin groups
on:
  push:
    branches: [fix/583-verify]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            host: darwin
            arch: aarch64
          - runner: macos-15-intel
            host: darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/seed-mach
      - name: Retain released Darwin image and build audited compiler
        if: runner.os == 'macOS'
        run: python3 .github/scripts/std-583-darwin.py ${{ matrix.arch }}
      - name: Retain released seed behavior and build audited compiler
        if: runner.os != 'macOS'
        shell: bash
        run: python3 .github/scripts/std-583-audited.py ${{ matrix.host }} ${{ matrix.arch }}
      - name: Prove grouped spawning and full native suite
        shell: bash
        run: python3 .github/scripts/std-583-groups.py ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: std-583-barriers-${{ matrix.host }}-${{ matrix.arch }}
          path: std-583-evidence/
