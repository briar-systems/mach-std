name: verify rooted force removal
on:
  push:
    branches: [fix/613-verify]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            host: linux
          - runner: windows-latest
            host: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seed-mach
      - name: Verify exact force removal behavior
        shell: bash
        run: python .github/scripts/std-613-proof.py ${{ matrix.host }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: std-613-${{ matrix.host }}
          path: std-613-evidence/
