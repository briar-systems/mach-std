name: audit std584 durability mutations

on:
  push:
    branches: [fix/584-mutations]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/seed-mach
      - name: Verify combined baseline and independent mutations
        shell: pwsh
        run: python .github/scripts/durability-mutations.py "$PWD/.mach-seed/mach.exe"
      - name: Retain durability evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: std584-windows-mutations
          path: durability-evidence/
