name: CI

# the family contract: briar-systems/.github README. light legs run on every
# pull request into dev, heavy legs on a pull request into main, on a dispatch
# that names them, and on a release, which calls this workflow with heavy=all.

on:
  pull_request:
  workflow_call:
    inputs:
      heavy:
        type: string
        default: none
  workflow_dispatch:
    inputs:
      heavy:
        description: heavy work to run on this ref
        type: choice
        default: none
        options: [none, all, aarch64-linux, x86_64-darwin, riscv64-linux, cross-backends]

permissions:
  contents: read

jobs:
  # per-host verifiers run from .github/ci/verify.sh. the native suite there is
  # std's whole test suite under each target's known-failure policy, so the
  # plain test phase is off rather than run twice without that policy.
  #
  # aarch64 and darwin run NATIVE, not emulated. an emulator can be confidently
  # wrong about a kernel ABI constant (qemu-user's aarch64 target accepts 0x4000
  # as O_DIRECTORY), and apple arm64 alone passes a C-variadic tail on the stack,
  # so a wrong `openat(..., mode)` there only shows as wrong permission bits.
  # neither darwin row stands in for the other. riscv64 has no native runner, so
  # its qemu result stays provisional. cross-backends catches a target-gated
  # module silently dropping out of the windows and darwin builds.
  lib:
    uses: briar-systems/.github/.github/workflows/mach-lib.yml@main
    with:
      heavy: ${{ inputs.heavy }}
      submodules: "true"
      test: false
      light-legs: '["x86_64-windows", "aarch64-darwin"]'
      extra-legs: >-
        [{"name": "riscv64-linux", "runs-on": "ubuntu-latest", "tier": "heavy",
          "target": "linux-riscv64", "runner": "qemu-riscv64"},
         {"name": "cross-backends", "runs-on": "ubuntu-latest", "tier": "heavy",
          "apt": ["llvm"]}]
      evidence: |
        test/native/results/
        test/backends/out/**/ir/**/*.ir
        test/backends/out/**/asm/**/*.s

  # light tier: std modules that build freestanding stay building (#684)
  freestanding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: seed
        uses: briar-systems/.github/.github/actions/seed-mach@main
      - name: freestanding build ratchet
        run: bash test/freestanding/verify.sh "${{ steps.seed.outputs.compiler }}"

  gate:
    if: always()
    needs: [lib, freestanding]
    runs-on: ubuntu-latest
    steps:
      - uses: briar-systems/.github/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
