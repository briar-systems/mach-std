name: CI

on:
  workflow_call:
  pull_request:
    branches: [dev, main]
  # release branches also build on push. a pull_request trigger is selected from
  # the base branch, so adding `main` above cannot take effect for the very PR
  # that adds it -- the first release PR would still land untested.
  push:
    branches:
      - 'chore/release-*'
      - 'hotfix/*'

jobs:
  linux-x86_64:
    name: linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Seed mach
        uses: ./.github/actions/seed-mach

      - name: Report the seed
        run: mach info
      - name: Build
        run: mach build .

      - name: Run the complete native suite
        run: bash test/native/verify.sh mach linux-x86_64

      - name: Collect native ELF evidence
        run: |
          set -o pipefail
          bash test/backends/verify-native.sh mach linux-x86_64 \
            | tee test/native/results/linux-x86_64-format.log

      - name: RELRO re-protection contract
        run: bash test/relro/verify.sh

      - name: Relative-target directory symlink
        run: bash test/symlink/verify.sh

      - name: SIGPIPE suppression
        run: bash test/sigpipe/verify.sh

      - name: Tracked child termination
        run: bash test/terminate-child/verify.sh

      # derive's refusals are `$error`s that fire during instantiation, so they
      # are evidenced by a build that fails rather than by a test that runs. the
      # classification is over field shapes and is target-independent, so one
      # leg is the whole signal.
      - name: std.derive comptime refusals
        run: bash test/derive/verify.sh

      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-evidence-linux-x86_64
          path: test/native/results/
          if-no-files-found: warn
          retention-days: 14

  cross-riscv64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user

      - name: Seed mach
        uses: ./.github/actions/seed-mach

      - name: Report the seed
        run: mach info
      - name: Cross-compile and run the riscv64 runtime smoke test
        run: bash test/riscv64/verify.sh

      # the library suite under qemu-user. this is real coverage for LOGIC and a
      # weak signal for ABI CONSTANTS, per the note on the arm64 job below: an
      # emulator can be confidently wrong about a flag value. it is still what
      # would have caught #436, whose defect was a wrong constant producing a hard
      # EINVAL rather than a subtle divergence. riscv64 has no native runner
      # available, so a riscv64-only result stays provisional.
      - name: Run the test suite on riscv64
        run: mach test . --target linux-riscv64 --runner qemu-riscv64

      - name: RELRO re-protection contract (riscv64)
        run: bash test/relro/verify.sh mach linux-riscv64 qemu-riscv64

      - name: SIGPIPE suppression (riscv64)
        run: bash test/sigpipe/verify.sh mach linux-riscv64 qemu-riscv64

      - name: Tracked child termination (riscv64)
        run: bash test/terminate-child/verify.sh mach linux-riscv64 qemu-riscv64

  # aarch64 runs NATIVE, not under qemu-user. qemu-user does not faithfully model
  # the kernel ABI: its aarch64 target accepts 0x4000 as O_DIRECTORY, which is
  # O_DIRECT's value and is refused by a real kernel, while its riscv64 target
  # refuses the same value. A flag constant is exactly the kind of fact an emulator
  # can be wrong about and a real kernel cannot, so the leg that decides whether the
  # syscall surface is correct has to be real hardware. (mach's own int harness
  # keeps its aarch64 leg native for the same class of reason, briar-systems/mach#1885.)
  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Seed mach
        uses: ./.github/actions/seed-mach

      - name: Report the seed
        run: mach info
      - name: Run the complete native suite on aarch64
        run: bash test/native/verify.sh mach linux-arm64

      - name: Collect native ELF evidence
        run: |
          set -o pipefail
          bash test/backends/verify-native.sh mach linux-arm64 \
            | tee test/native/results/linux-arm64-format.log

      - name: RELRO re-protection contract (aarch64)
        run: bash test/relro/verify.sh mach linux-arm64

      - name: SIGPIPE suppression (aarch64)
        run: bash test/sigpipe/verify.sh mach linux-arm64

      - name: Tracked child termination (aarch64)
        run: bash test/terminate-child/verify.sh mach linux-arm64

      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-evidence-linux-arm64
          path: test/native/results/
          if-no-files-found: warn
          retention-days: 14

  # windows runs the complete suite and the host-specific process probes on a
  # native kernel. the known-failure gate rejects new failures and stale entries.
  windows:
    name: windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Seed mach
        uses: ./.github/actions/seed-mach

      - name: Report the seed
        run: mach info

      - name: Run the complete native suite
        shell: bash
        run: bash test/native/verify.sh "$PWD/.mach-seed/mach.exe" windows-x86_64

      - name: Collect native PE evidence
        shell: bash
        run: |
          set -o pipefail
          bash test/backends/verify-native.sh "$PWD/.mach-seed/mach.exe" windows-x86_64 \
            | tee test/native/results/windows-x86_64-format.log

      # the explicit path rather than the PATH entry: this probe runs under bash on
      # the windows runner and takes the compiler as an argument, so it names the
      # binary the seed step just installed.
      - name: Relative-target directory symlink
        shell: bash
        run: bash test/symlink/verify.sh "$PWD/.mach-seed/mach.exe" windows-x86_64

      - name: SIGPIPE suppression
        shell: bash
        run: bash test/sigpipe/verify.sh "$PWD/.mach-seed/mach.exe" windows-x86_64

      - name: Tracked child termination
        shell: bash
        run: bash test/terminate-child/verify.sh "$PWD/.mach-seed/mach.exe" windows-x86_64

      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-evidence-windows-x86_64
          path: test/native/results/
          if-no-files-found: warn
          retention-days: 14

  # darwin runs NATIVE on both architectures, for the same reason the arm64 job
  # above is native rather than emulated -- and with a sharper edge now that the
  # backend calls libSystem instead of issuing raw traps.
  #
  # the darwin OS layer is the only place mach-std depends on a C-VARIADIC call,
  # and apple arm64 is the only platform that passes the whole variadic tail on
  # the stack. a wrongly-lowered `openat(..., mode)` there does not fail to link
  # and does not crash: it creates a file with the wrong permission bits. that
  # divergence exists on ONE of these two rows, so a pass on the other says
  # nothing about it, and neither row can stand in for the other.
  #
  # `cross-backends` still cross-compiles darwin from linux and is not made
  # redundant by this job -- it is the leg that catches a target-gated module
  # silently dropping out of the build. it just cannot execute anything.
  darwin:
    name: darwin ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Seed mach
        uses: ./.github/actions/seed-mach

      - name: Report the seed
        run: mach info

      - name: Build
        run: mach build .

      - name: Run the complete native suite on darwin
        run: bash test/native/verify.sh mach "darwin-${{ matrix.arch }}"

      - name: SIGPIPE suppression
        run: bash test/sigpipe/verify.sh mach "darwin-${{ matrix.arch }}"

      - name: Tracked child termination
        run: bash test/terminate-child/verify.sh mach "darwin-${{ matrix.arch }}"

      - name: Collect native Mach-O evidence
        run: |
          set -o pipefail
          bash test/backends/verify-native.sh mach "darwin-${{ matrix.arch }}" \
            | tee "test/native/results/darwin-${{ matrix.arch }}-format.log"

      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-evidence-darwin-${{ matrix.arch }}
          path: test/native/results/
          if-no-files-found: warn
          retention-days: 14

  cross-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Seed mach
        uses: ./.github/actions/seed-mach

      - name: Report the seed
        run: mach info
      - name: Cross-compile the windows and darwin backends
        run: bash test/backends/verify.sh
