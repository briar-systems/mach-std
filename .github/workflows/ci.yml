name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      runners:
        description: runners to test on, as a JSON array, e.g. ["macos-15", "windows-latest"]
        type: string
      profile:
        description: build profile
        type: string
        default: debug
  workflow_call:
    inputs:
      runners:
        type: string
      profile:
        type: string
        default: debug

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MACH_REF: bb7d6a3a09dbcb4123b931619075018b8173599f
  PROFILE: ${{ inputs.profile || 'debug' }}

jobs:
  # every runner builds every artifact for every target and tests the ones it can run
  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      # until a 7.x release exists, std is built with the compiler built from the
      # mach commit pinned in MACH_REF. mach's own bootstrap walks the seed chain
      # its ci tests, so mach owns seeding. MACH_REF moves with the pr
      # that needs it.
      - name: restore the pinned mach
        id: mach
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/mach
          key: mach-${{ runner.os }}-${{ runner.arch }}-${{ env.MACH_REF }}
      - id: src
        if: steps.mach.outputs.cache-hit != 'true'
        env:
          MACH_REF: ${{ env.MACH_REF }}
        run: |
          src=$RUNNER_TEMP/mach-src
          rm -rf "$src"
          git init --quiet "$src"
          git -C "$src" remote add origin https://github.com/briar-systems/mach
          git -C "$src" fetch --quiet --depth 1 origin "$MACH_REF"
          git -C "$src" checkout --quiet FETCH_HEAD
          if command -v sha256sum >/dev/null; then
            chain=$(sha256sum "$src/.github/bootstrap-chain" | awk '{print $1}')
          else
            chain=$(shasum -a 256 "$src/.github/bootstrap-chain" | awk '{print $1}')
          fi
          echo "chain=$chain" >> "$GITHUB_OUTPUT"
      - id: chain
        if: steps.mach.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/chain
          key: chain-${{ runner.os }}-${{ runner.arch }}-${{ steps.src.outputs.chain }}
          restore-keys: |
            chain-${{ runner.os }}-${{ runner.arch }}-
      - name: build mach at MACH_REF
        if: steps.mach.outputs.cache-hit != 'true'
        run: |
          exe=
          [ "$RUNNER_OS" = Windows ] && exe=.exe
          (cd "$RUNNER_TEMP/mach-src" && GITHUB_ENV="$RUNNER_TEMP/mach.env" bash .github/scripts/bootstrap.sh)
          mkdir -p "$RUNNER_TEMP/mach"
          cp "$(sed -n 's/^MACH=//p' "$RUNNER_TEMP/mach.env" | tail -n 1)" "$RUNNER_TEMP/mach/mach$exe"
      - if: steps.mach.outputs.cache-hit != 'true' && steps.chain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/chain
          key: chain-${{ runner.os }}-${{ runner.arch }}-${{ steps.src.outputs.chain }}
      - if: steps.mach.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/mach
          key: mach-${{ runner.os }}-${{ runner.arch }}-${{ env.MACH_REF }}
      - name: add mach to PATH
        run: echo "$RUNNER_TEMP/mach" >> "$GITHUB_PATH"
      - run: mach dep pull .
      - if: strategy.job-index == 0
        run: mach fmt --check .
      - run: mach test . --all -p "$PROFILE"

  gate:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: exit ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 1 || 0 }}
