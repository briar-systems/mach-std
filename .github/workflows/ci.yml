name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      runners:
        description: runners to test on, as a JSON array, e.g. ["macos-15", "windows-latest"]
        type: string
  workflow_call:
    inputs:
      runners:
        type: string
      profile:
        type: string
        default: debug

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MACH_VERSION: 6.10.1
  PROFILE: ${{ inputs.profile || 'debug' }}

jobs:
  # every runner builds every artifact for every target and tests the ones it can run
  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      # until a 7.x release exists, std is tested with the compiler built from
      # mach's dev branch, since the released seed cannot read its manifest keys
      - name: build mach from its dev branch
        run: |
          export MACH_INSTALL_DIR="$RUNNER_TEMP/seed"
          url="https://raw.githubusercontent.com/briar-systems/mach/v$MACH_VERSION/dist"
          exe=
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command "irm $url/install.ps1 | iex"
            exe=.exe
          else
            curl -fsSL "$url/install.sh" | sh
          fi
          git clone --quiet --depth 1 --branch dev https://github.com/briar-systems/mach "$RUNNER_TEMP/mach-src"
          mkdir -p "$RUNNER_TEMP/mach"
          (cd "$RUNNER_TEMP/mach-src" && bash .github/scripts/seed-build.sh "$MACH_INSTALL_DIR/mach$exe" "$RUNNER_TEMP/mach/mach$exe")
          echo "$RUNNER_TEMP/mach" >> "$GITHUB_PATH"
      - run: mach dep pull .
      - if: strategy.job-index == 0
        run: mach fmt --check .
      - run: mach test . --all -p "$PROFILE"

  gate:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: exit ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 1 || 0 }}
