name: verify borrowed path roots
on:
  push:
    branches: [fix/608-proof]
permissions:
  contents: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seed-mach
        id: seed
      - name: Run native boundary and mutation proof serially
        env:
          SEED_TAG: ${{ steps.seed.outputs.tag }}
        run: python .github/scripts/path-root-proof.py
      - name: Retain proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: path-root-${{ matrix.runner }}
          path: path-root-evidence/
