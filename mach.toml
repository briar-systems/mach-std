[project]
id = "std"
version = "0.25.1"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.linux-riscv64]
isa = "riscv64"
os  = "linux"
abi = "lp64"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[link.kernel32]
source = "system"
name = "kernel32.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = true

[link.ws2_32]
source = "system"
name = "ws2_32.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = true

[link.advapi32]
source = "system"
name = "advapi32.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = true

[link.synch]
source = "system"
name = "api-ms-win-core-synch-l1-2-0.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = true

[artifact.std]
kind = "static"
entry = "lib/libstd.mach"
out = "lib/std"
targets = ["*"]
link = ["kernel32", "ws2_32", "advapi32", "synch"]
need = []
