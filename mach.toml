[project]
id = "std"
version = "9.5.0"
mach = "^6"
src = "src"
work = "out/{target.name}/{profile.name}"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-aarch64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.linux-riscv64]
arch = "riscv64"
sys = "linux"
abi = "lp64"

[target.linux-riscv32]
arch = "riscv32"
sys = "linux"
abi = "ilp32d"
isa = "rv32i2p1_m2p0_a2p1_f2p2_d2p2_c2p0_zicsr2p0_zifencei2p0"

[target.windows-x86_64]
arch = "x86_64"
sys = "windows"
env = "msvc"
abi = "win64"

[target.windows-aarch64]
arch = "aarch64"
sys = "windows"
env = "msvc"
abi = "aapcs64win"

[target.darwin-x86_64]
arch = "x86_64"
sys = "darwin"
env = "macos"
abi = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
env = "macos"
abi = "aapcs64"

# preview 1: threadless, with the capability row std.system.capability states.
# a float to an integer saturates, which wasm spells with nontrapping-fptoint
[target.wasi-wasm32]
arch = "wasm32"
sys = "wasi"
env = "preview1"
abi = "basic"
ext = ["nontrapping-fptoint"]

# darwin's platform library, and the only supported way to reach the kernel:
# apple does not promise syscall numbers. `name` is the full install name
# every dyld-loaded image already links libSystem under, so the image carries
# one load command for it. the link records it as written and looks for it on
# no disk: libSystem lives in the shared cache from macOS 11, not at that path.
# it states no versions, so its load command records 0.0.0 for both, which
# every libSystem satisfies, as dyld compares only the compatibility version.
# `#[library("libsystem")]` names this entry by its table key.
[link.libsystem]
source  = "system"
name    = "/usr/lib/libSystem.B.dylib"
sys     = ["darwin"]
arch    = ["*"]
abi     = ["*"]
export  = true

[link.kernel32]
source = "system"
name = "kernel32.dll"
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = true

[link.ws2_32]
source = "system"
name = "ws2_32.dll"
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = true

[link.bcrypt]
source = "system"
name = "bcrypt.dll"
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = true

[link.advapi32]
source = "system"
name = "advapi32.dll"
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = true

[link.synch]
source = "system"
name = "api-ms-win-core-synch-l1-2-0.dll"
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = true

# the library, and the only artifact `mach build .` selects
[artifact.std]
kind = "static"
default = true
export = true
entry = "lib/libstd.mach"
out = "{project.work}/lib/std"
targets = ["*"]
link = ["kernel32", "ws2_32", "bcrypt", "advapi32", "synch", "libsystem"]
need = []

# test-only: the modules the library does not reach, run with `mach test . -a tests`
[artifact.tests]
kind = "static"
entry = "lib/tests.mach"
out = "{project.work}/lib/tests"
targets = ["*"]
link = ["kernel32", "ws2_32", "bcrypt", "advapi32", "synch", "libsystem"]
need = []
