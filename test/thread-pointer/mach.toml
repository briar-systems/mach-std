[project]
id = "thread_pointer"
version = "0.0.0"
mach = "^6"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
env = "gnu"
abi = "sysv64"

[target.linux-aarch64]
arch = "aarch64"
sys = "linux"
env = "gnu"
abi = "aapcs64"

[target.linux-riscv64]
arch = "riscv64"
sys = "linux"
env = "gnu"
abi = "lp64"

# bare, so the static image names no interpreter and std owns its thread pointer
[target.linux-x86_64-bare]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-aarch64-bare]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.linux-riscv64-bare]
arch = "riscv64"
sys = "linux"
abi = "lp64"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

# the C fixture verify.sh builds for the selected target
[link.probe]
source = "local"
path = "c/out/libprobe.so"
sys = ["linux"]
arch = ["*"]
abi = ["*"]
export = false

[artifact.static]
kind = "bin"
entry = "static.mach"
out = "{project.work}/bin/static"
targets = ["linux-x86_64-bare", "linux-aarch64-bare", "linux-riscv64-bare"]
link = []
need = []

[artifact.dynamic]
kind = "bin"
entry = "dynamic.mach"
out = "{project.work}/bin/dynamic"
targets = ["linux-x86_64", "linux-aarch64", "linux-riscv64"]
link = ["probe"]
need = []

[dep.std]
path = "../.."
