[project]
id = "thread_pointer"
version = "0.0.0"
mach = "^6"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os = "linux"
abi = "aapcs64"

[target.linux-riscv64]
isa = "riscv64"
os = "linux"
abi = "lp64"

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

# the C fixture verify.sh builds for the selected target
[link.probe]
source = "local"
path = "c/out/libprobe.so"
library = "probe"
os = "linux"
isa = "*"
abi = "*"
export = false

[artifact.static]
kind = "bin"
entry = "static.mach"
out = "bin/static"
targets = ["*"]
link = []
need = []

[artifact.dynamic]
kind = "bin"
entry = "dynamic.mach"
out = "bin/dynamic"
targets = ["*"]
link = ["probe"]
need = []

[dep.std]
path = "dep/std"
