[project]
id = "ditprobe"
version = "0.0.0"
mach = "^6"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-arm64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

# a link that admits a secret multiply: the linker's byte is 1
[artifact.secret]
kind = "bin"
entry = "secret.mach"
out = "{project.work}/bin/secret"
targets = ["*"]
link = []
need = []

# the same program without the multiply: the byte is 0
[artifact.plain]
kind = "bin"
entry = "plain.mach"
out = "{project.work}/bin/plain"
targets = ["*"]
link = []
need = []

[dep.std]
path = "dep/std"
