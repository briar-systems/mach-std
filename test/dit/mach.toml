[project]
id = "ditprobe"
version = "0.0.0"
mach = "^6"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-aarch64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
env = "macos"
abi = "aapcs64"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

# a program with a soft constant-time function
[artifact.secret]
kind = "bin"
entry = "secret.mach"
out = "{project.work}/bin/secret"
targets = ["*"]
link = []
need = []

# the same program without it
[artifact.plain]
kind = "bin"
entry = "plain.mach"
out = "{project.work}/bin/plain"
targets = ["*"]
link = []
need = []

[dep.std]
path = "../.."
