[project]
id = "entropyprobe"
version = "0.0.0"
mach = "^6"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.darwin-x86_64]
arch = "x86_64"
sys = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "aapcs64"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.entropy]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/entropy"
targets = ["*"]
link = []
need = []

[dep.std]
path = "../.."
