[project]
id = "stackguardprobe"
version = "0.0.0"
mach = "^6"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.linux-riscv64]
arch = "riscv64"
sys = "linux"
abi = "lp64"

[target.darwin-x86_64]
arch = "x86_64"
sys = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "aapcs64"

[target.windows-x86_64]
arch = "x86_64"
sys = "windows"
abi = "win64"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.windows-opt0]
optimize = false
debug = false
simd = "scalarize"

[artifact.stack_guard_probe]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/stack_guard_probe"
targets = ["*"]
link = []
need = []

[dep.std]
path = "../.."
