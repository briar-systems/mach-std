[project]
id = "cpuprobe"
version = "0.0.0"
mach = "^6"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
abi = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys  = "linux"
abi = "aapcs64"

[target.windows-x86_64]
arch = "x86_64"
sys  = "windows"
abi = "win64"

[target.darwin-x86_64]
arch = "x86_64"
sys  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys  = "darwin"
abi = "aapcs64"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

# prints what std.system.cpu.features() reports beside the OS's raw answer
[artifact.cpu]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/cpu"
targets = ["*"]
link = []
need = []

[dep.std]
path = "../.."
