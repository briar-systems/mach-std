[project]
id = "rvprobe"
version = "0.0.0"
mach = "^6"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-riscv64]
isa = "riscv64"
os  = "linux"
abi = "lp64"

[profile.debug]
optimize = false
debug = true
simd = "scalarize"

[artifact.rvprobe]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/rvprobe"
targets = ["*"]
link = []
need = []

[dep.std]
path = "dep/std"
