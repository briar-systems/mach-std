[project]
id = "terminatechildprobe"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.linux-riscv64]
isa = "riscv64"
os  = "linux"
abi = "lp64"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[target.windows-x86_64]
isa = "x86_64"
os  = "windows"
abi = "win64"

[profile.debug]
opt = 0
debug = true
simd = "scalarize"

[artifact.terminate_child_probe]
kind = "bin"
entry = "main.mach"
out = "bin/terminate_child_probe"
targets = ["*"]
link = []
need = []

[dep.std]
path = "dep/std"
