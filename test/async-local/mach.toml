[project]
id = "asynclocal"
version = "0.0.0"
mach = "^7"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-aarch64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.darwin-x86_64]
arch = "x86_64"
sys = "darwin"
env = "macos"
abi = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
env = "macos"
abi = "darwinpcs"

[target.windows-x86_64]
arch = "x86_64"
sys = "windows"
env = "msvc"
abi = "win64"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

# the coff backend has no debug model
[profile.windows-opt0]
optimize = false
debug = false
simd = "scalarize"

[artifact.asynclocal]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/asynclocal"
targets = ["*"]
link = []
need = []

[dep.std]
path = "../.."
