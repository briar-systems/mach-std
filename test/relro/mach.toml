[project]
id = "relroprobe"
version = "0.0.0"
mach = "^6"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-aarch64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.linux-riscv64]
arch = "riscv64"
sys = "linux"
abi = "lp64"

[profile.debug]
optimize = false
debug = true
simd = "scalarize"

[artifact.relro_happy]
kind = "bin"
entry = "happy.mach"
out = "{project.work}/bin/relro_happy"
targets = ["*"]
link = []
need = []

[artifact.relro_fault]
kind = "bin"
entry = "fault.mach"
out = "{project.work}/bin/relro_fault"
targets = ["*"]
link = []
need = []

[dep.std]
path = "../.."
