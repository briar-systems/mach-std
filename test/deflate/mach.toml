[project]
id = "deflate-reference"
version = "0.0.0"
mach = "^6"
src = "src"
work = "out/{target.name}/{profile.name}"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[target.linux-x86_64]
isa = "x86_64"
os = "linux"
abi = "sysv64"

[artifact.deflate]
kind = "bin"
entry = "bin/deflate.mach"
out = "{project.work}/bin/deflate"
targets = ["*"]
link = []
need = []

[dep.std]
path = "../.."
