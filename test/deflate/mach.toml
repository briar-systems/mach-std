[project]
id = "deflate-reference"
version = "0.0.0"
mach = "^6"
src = "src"
out = "out/{target.name}/{profile.name}"

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[target.linux-x86_64]
isa = "x86_64"
os = "linux"
abi = "sysv64"

[artifact.deflate]
kind = "bin"
entry = "bin/deflate.mach"
out = "bin/deflate"
targets = ["*"]
link = []
need = []

[dep.std]
path = "dep/std"
