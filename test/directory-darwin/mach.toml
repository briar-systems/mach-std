[project]
id = "directoryprobe"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.darwin-x86_64]
isa = "x86_64"
os = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os = "darwin"
abi = "aapcs64"

[profile.debug]
opt = 0
debug = true
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[artifact.directory]
kind = "bin"
entry = "main.mach"
out = "bin/directory"
targets = ["*"]
link = []
need = []

[dep.std]
path = "dep/std"
