[project]
id = "sha256-secret-refusals"
version = "0.0.0"
mach = "^6"
src = "src"
work = "out/{target.name}/{profile.name}"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[target.linux-x86_64]
isa = "x86_64"
os = "linux"
abi = "sysv64"

[artifact.refusals]
kind = "bin"
entry = "refusals.mach"
out = "{project.work}/bin/refusals"
targets = ["*"]
link = []
need = []

[dep.std]
path = "dep/std"
