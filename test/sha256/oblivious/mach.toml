[project]
id = "sha256-oblivious-asm"
version = "0.0.0"
mach = "^5.5.2"
src = "src"
out = "out/{target.name}/{profile.name}"

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[target.linux-x86_64]
isa = "x86_64"
os = "linux"
abi = "sysv64"

[artifact.branch]
kind = "bin"
entry = "branch.mach"
out = "bin/branch"
targets = ["*"]
link = []
need = []

[artifact.address]
kind = "bin"
entry = "address.mach"
out = "bin/address"
targets = ["*"]
link = []
need = []

[dep.std]
path = "dep/std"
