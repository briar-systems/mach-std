[project]
id = "sha256-oblivious-asm"
version = "0.0.0"
mach = "^6"
src = "src"
work = "out/{target.name}/{profile.name}"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[target.linux-x86_64]
isa = "x86_64"
os = "linux"
abi = "sysv64"

[artifact.branch]
kind = "bin"
entry = "branch.mach"
out = "{project.work}/bin/branch"
targets = ["*"]
link = []
need = []

[artifact.address]
kind = "bin"
entry = "address.mach"
out = "{project.work}/bin/address"
targets = ["*"]
link = []
need = []

[dep.std]
path = "dep/std"
