[project]
id = "thread-resources"
version = "0.0.0"
mach = "^6"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.linux-riscv64]
arch = "riscv64"
sys = "linux"
abi = "lp64"

[target.darwin-x86_64]
arch = "x86_64"
sys = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "aapcs64"

[target.windows-x86_64]
arch = "x86_64"
sys = "windows"
abi = "win64"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.windows-opt0]
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[link.libproc]
source = "system"
name = "/usr/lib/libproc.dylib"
sys = ["darwin"]
arch = ["*"]
abi = ["*"]
export = false

[artifact.thread-resources]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/thread-resources"
targets = ["*"]
link = ["libproc"]
need = []

[dep.std]
path = "../.."
