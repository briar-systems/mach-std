[project]
id = "backends"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.windows-x86_64]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[profile.debug]
opt = 0
debug = true
simd = "scalarize"

[artifact.backends]
kind = "bin"
entry = "main.mach"
out = "bin/backends"
targets = ["*"]
link = []
need = []

[dep.std]
path = "dep/std"
