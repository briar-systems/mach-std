[project]
id = "native-suite"
version = "0.0.0"
mach = "^6"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os = "linux"
abi = "aapcs64"

[target.darwin-x86_64]
isa = "x86_64"
os = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os = "darwin"
abi = "aapcs64"

[target.windows-x86_64]
isa = "x86_64"
os = "windows"
abi = "win64"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[profile.windows-opt0]
optimize = false
debug = false
simd = "scalarize"

[artifact.native-suite]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/native-suite"
targets = ["*"]
link = []
need = []

[dep.std]
path = "../.."
