[project]
id = "fault"
version = "0.0.0"
mach = "^6"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-aarch64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.linux-riscv64]
arch = "riscv64"
sys = "linux"
abi = "lp64"

[target.windows-x86_64]
arch = "x86_64"
sys = "windows"
abi = "win64"

[target.darwin-x86_64]
arch = "x86_64"
sys = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "aapcs64"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.windows-opt0]
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

# the test-only aggregate, and the only artifact `mach build` selects
[artifact.fault]
kind = "static"
default = true
entry = "lib/libfault.mach"
out = "{project.work}/lib/fault"
targets = ["*"]
link = []
need = []

# what `mach test -a tests` runs: the fault modules with the dispatcher's runtime
[artifact.tests]
kind = "static"
entry = "lib/tests.mach"
out = "{project.work}/lib/tests"
targets = ["*"]
link = []
need = []

[dep.std]
path = "../.."
